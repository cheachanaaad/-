<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>이력서 편집기</title>
<style>
body{font-family:system-ui;margin:20px}
textarea{width:100%;height:120px}
iframe{width:100%;height:800px;border:1px solid #ddd;margin-top:10px}
button{padding:8px 14px;margin-top:10px}
</style>
</head>
<body>
<h2>이력서 편집기</h2>
<textarea id="json" placeholder='{"name":"홍길동"}'></textarea>
<br>
<button onclick="render()">미리보기</button>
<button onclick="window.print()">인쇄</button>
<iframe id="preview"></iframe>
<script>
function esc(s){
  return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
}
function render(){
  let data={};
  try{ data=JSON.parse(document.getElementById("json").value) }catch(e){ alert("JSON 오류"); return }
  const html=`
  <html><body style="font-family:Malgun Gothic;padding:40px">
  <h1 style="letter-spacing:10px;text-align:center">이 력 서</h1>
  <p><b>성명:</b> ${esc(data.name||"")}</p>
  </body></html>`;
  document.getElementById("preview").srcdoc=html;
}
</script>
</body></html>
