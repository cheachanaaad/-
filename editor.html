<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>이력서 편집기</title>

<style>
@page { size: A4; margin: 15mm; }

@media print {
  body { background:#fff !important; }
  .toolbar { display:none !important; }
  .sheet { box-shadow:none !important; margin:0 !important; }
}

:root{
  --border:#222;
  --thin:1px;
  --font:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f4f4;
  font-family:var(--font);
}

.toolbar{
  position:sticky;
  top:0;
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px;
  border-bottom:1px solid #e6e6e6;
}

.btn{
  padding:8px 14px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  font-weight:700;
}

.btn.primary{
  background:#111;
  color:#fff;
  border-color:#111;
}

.sheet{
  width:210mm;
  background:#fff;
  margin:20px auto;
  padding:10mm;
  box-shadow:0 8px 28px rgba(0,0,0,.12);
  box-sizing:border-box;
}

/* 🔥 frame border 완전 제거 */
.frame{
  padding:0;
}

.title{
  text-align:center;
  font-size:26px;
  letter-spacing:18px;
  font-weight:bold;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}

th, td{
  border:1px solid var(--border);
  padding:6px;
  text-align:center;
  vertical-align:middle;
}

.label{ width:18%; font-weight:bold; }
.value{ width:32%; }
.label-sm{ width:16%; font-weight:bold; }
.value-sm{ width:34%; }

.section-title{
  font-weight:bold;
  padding:8px 0;
}

.blank-row td{ height:12mm; }

.nowrap{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rrn-cell{
  height:28px;
  line-height:28px;
}

[contenteditable="true"]:focus{
  outline:2px solid rgba(0,0,0,.15);
}
</style>
</head>

<body>

<div class="toolbar">
  <button class="btn primary" onclick="window.print()">인쇄(A4)</button>
</div>

<div class="sheet">
  <div class="frame" id="root"></div>
</div>

<script>
function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* ✅ URL-safe base64(-, _) + 패딩 보정 + UTF-8 디코딩 */
function b64ToUtf8(b64){
  // URL-safe -> standard
  b64 = String(b64 || "").replace(/-/g, "+").replace(/_/g, "/");

  // padding 보정
  const pad = b64.length % 4;
  if (pad === 2) b64 += "==";
  else if (pad === 3) b64 += "=";
  else if (pad === 1) throw new Error("Invalid base64 length");

  // atob -> binary string
  const bin = atob(b64);

  // binary -> Uint8Array -> UTF-8 string
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);

  return new TextDecoder("utf-8").decode(bytes);
}

function parseHashData(){
  const m = location.hash.match(/#data=([^&]+)/);
  if(!m) return {};
  try{
    const jsonStr = b64ToUtf8(m[1]);
    return JSON.parse(jsonStr);
  }catch(e){
    console.error("hash data decode error:", e);
    return {};
  }
}

function render(data){
  const rows = Array.isArray(data.rows) ? data.rows : [];
  const licenses = Array.isArray(data.licenses) ? data.licenses : [];

  const rowsHtml = rows.map(r => `
    <tr>
      <td class="nowrap" contenteditable="true">${esc(r.date||"")}</td>
      <td contenteditable="true">${esc(r.content||"")}</td>
      <td contenteditable="true">${esc(r.issuer||"")}</td>
    </tr>
  `).join("");

  document.getElementById("root").innerHTML = `
    <div class="title">이 력 서</div>

    <table>
      <tr>
        <td class="label">성명</td>
        <td class="value" contenteditable="true">${esc(data.name||"")}</td>
        <td class="label-sm">주민등록번호</td>
        <td class="value-sm rrn-cell nowrap" contenteditable="true">${esc(data.rrn||"")}</td>
      </tr>
      <tr>
        <td class="label">생년월일</td>
        <td class="value nowrap" contenteditable="true">${esc(data.birth||"")}</td>
        <td class="label-sm">성별(남·여)</td>
        <td class="value-sm nowrap" contenteditable="true">${esc(data.gender||"")}</td>
      </tr>
      <tr>
        <td class="label">주소</td>
        <td colspan="3" contenteditable="true">${esc(data.address||"")}</td>
      </tr>
      <tr>
        <td class="label">E-mail</td>
        <td class="value" contenteditable="true">${esc(data.email||"")}</td>
        <td class="label-sm">전화 / H.P</td>
        <td class="value-sm nowrap" contenteditable="true">${esc(data.phone||"")}</td>
      </tr>
    </table>

    <table style="margin-top:12px;">
      <tr><th colspan="3" class="section-title">학력 및 경력사항</th></tr>
      <tr>
        <th>년 월 일</th>
        <th>학력 및 경력사항</th>
        <th>발령청</th>
      </tr>
      ${rowsHtml}
      <tr class="blank-row"><td></td><td></td><td></td></tr>
      <tr class="blank-row"><td></td><td></td><td></td></tr>
      <tr class="blank-row"><td></td><td></td><td></td></tr>
    </table>

    <table style="margin-top:12px;">
      <tr><th class="section-title">자격증</th></tr>
      <tr>
        <td contenteditable="true">${esc(licenses.join(" / "))}</td>
      </tr>
    </table>
  `;
}

render(parseHashData());
</script>

</body>
</html>
